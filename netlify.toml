[build]
  command = "pnpm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24.14.0"
  NEXT_PUBLIC_REALTIME_API_URL = "https://ddangkong-realtime.mandalart.workers.dev"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "https://ddangkong.netlify.app/*"
  to = "https://ddangkong.suulab.xyz/:splat"
  status = 301
  force = true
